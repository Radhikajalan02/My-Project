<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manufacturer Details</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .manufacturer-box {
      width: 450px;
      padding: 30px 40px;
      border: 3px solid #000000;
      border-radius: 18px;
      text-align: center;
      background: #ffffff;
    }

    .manufacturer-box h2 {
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .manufacturer-box p {
      font-size: 17px;
      line-height: 1.6;
      color: #000000;
    }

    .manufacturer-name {
      font-weight: 700;
      font-size: 19px;
    }

    .address {
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="manufacturer-box">
    <h2>Manufacturer Details</h2>

    <p>
      Manufactured By-<br>
      <span class="manufacturer-name">PURNIMA BAKERS</span>
    </p>

    <p class="address">
      Srinagar, Chota Dudhpatil Grant,<br>
      Silchar-2, Cachar, Assam
    </p>
  </div>

</body>
</html>
